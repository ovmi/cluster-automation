---
- name: Resolve GlusterFS installation targets
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    target_group: gluster_targets

  pre_tasks:
    - name: Validate glusterfs_mode command parameter
      ansible.builtin.assert:
        that:
          - glusterfs_mode in ['install', 'remove']
        fail_msg: "Invalid glusterfs_mode={{ glusterfs_mode }}"

    - name: Check parameters for valid nodes
      ansible.builtin.include_role:
        name: common
        tasks_from: node_check.yml

    - name: Add resolved nodes to gluster targets group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "{{ target_group }}"
      loop: "{{ resolved_hosts }}"

    - name: Derive Gluster hosts from logical node ids
      ansible.builtin.set_fact:
        gluster_control_host: "{{ node_host_map[gluster_control] }}"
        gluster_brick_hosts: "{{ gluster_bricks | map('extract', node_host_map) | list }}"
      run_once: true

- name: Setup GlusterFS
  hosts: gluster_targets
  become: true
  gather_facts: true

  pre_tasks:
    - name: Import derived Gluster facts from localhost
      ansible.builtin.set_fact:
        gluster_control_host: "{{ hostvars['localhost'].gluster_control_host }}"
        gluster_brick_hosts: "{{ hostvars['localhost'].gluster_brick_hosts }}"

  roles:
    - glusterfs_setup
    - k3s_glusterfs

# Install and configure GlusterFS on specified cluster nodes.
# Example command line to run this playbook:
# ansible-playbook playbooks/glusterfs_setup.yml -e nodes=node0,node1 -e glusterfs_mode=install [-e debug=true]
# Remove GlusterFS from the specified nodes:
# ansible-playbook playbooks/glusterfs_setup.yml -e nodes=node1 -e glusterfs_mode=remove [-e debug=true]
# Remove GlusterFS from control node (will stop/delete volume, detach peers, uninstall on control)
# ansible-playbook playbooks/glusterfs_setup.yml -e nodes=node0 -e glusterfs_mode=remove [-e debug=true]
