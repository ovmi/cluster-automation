---
# Only needed on Raspberry Pi aarch64: memory cgroups are disabled by
# default.
# x86 hosts, VMs, and containers already provide cgroups and
# do not use cmdline.txt.
- name: Enable cgroups via Pi bootloader cmdline.txt
  ansible.builtin.include_tasks: rpi_cgroup_cmdline.yml
  when: ansible_architecture == 'aarch64'

- name: Ensure k3s admin user exists
  ansible.builtin.user:
    name: "{{ k3s_admin_user }}"
    shell: /bin/bash
    create_home: true

- name: Ensure k3s admin group exists
  ansible.builtin.group:
    name: "{{ k3s_admin_group }}"
    system: true

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
    state: present
    update_cache: true

- name: Ensure Python3 and pip3 are installed
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: true
