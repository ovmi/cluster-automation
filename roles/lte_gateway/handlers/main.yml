---
- name: Restart route-monitor
  ansible.builtin.systemd:
    name: route-monitor
    state: restarted
    daemon_reload: true

- name: Restart cluster-gw-monitor
  ansible.builtin.systemd:
    name: cluster-gw-monitor
    state: restarted
    daemon_reload: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
