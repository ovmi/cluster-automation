- name: Ensure node_exporter group exists
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    state: present
    system: true

- name: Ensure node_exporter user exists
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Ensure textfile_collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_collector }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "{{ node_exporter_mode }}"

- name: Ensure temperature.prom exists with correct ownership
  ansible.builtin.file:
    path: "{{ node_exporter_collector }}/temperature.prom"
    state: touch
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: '0644'

- name: Copy temperature exporter script
  ansible.builtin.template:
    src: temperature_exporter.sh.j2
    dest: /usr/local/bin/temperature.sh
    mode: '0755'
    owner: root
    group: root

- name: Add cron job to export CPU temperature
  ansible.builtin.cron:
    name: "Export RPi CPU temperature"
    user: "{{ node_exporter_user }}"
    job: "/usr/local/bin/temperature.sh"
    minute: "*/1"
