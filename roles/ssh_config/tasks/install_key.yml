---
- name: Install controller public key (bootstrap) on {{ target }}
  ansible.posix.authorized_key:
    user: "{{ hostvars[target].ansible_user }}"
    key: "{{ lookup('file', ssh_public_key_path | expanduser) }}"
    state: present
    manage_dir: true
  delegate_to: "{{ target }}"
  vars:
    ansible_ssh_common_args: >-
      -o PreferredAuthentications=password,keyboard-interactive,publickey
      -o PubkeyAuthentication=yes
      -o PasswordAuthentication=yes
      -o KbdInteractiveAuthentication=yes
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    ansible_user: "{{ hostvars[target].ansible_user }}"
    ansible_password: "{{ hostvars[target].ansible_password }}"
    ansible_become_password: "{{ hostvars[target].ansible_become_password | default(hostvars[target].ansible_password) }}"
    ansible_ssh_private_key_file: "{{ omit }}"
