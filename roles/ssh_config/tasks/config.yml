---
- name: Ensure ~/.ssh exists on targets
  ansible.builtin.file:
    path: "{{ '/root' if hostvars[item].ansible_user == 'root' else '/home/' ~ hostvars[item].ansible_user }}/.ssh"
    state: directory
    owner: "{{ hostvars[item].ansible_user }}"
    group: "{{ hostvars[item].ansible_user }}"
    mode: "0700"
  delegate_to: "{{ item }}"
  loop: "{{ ssh_targets | default([]) }}"

- name: Ensure ssh drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ ssh_targets | default([]) }}"

- name: Remove stale pre-rename hardening drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-cluster.conf
    state: absent
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ ssh_targets | default([]) }}"
  register: ssh_stale_dropin

# Filename must sort before cloud-init's own drop-in -- see the README's
# "Drop-in filename ordering" section before renumbering this.
- name: Configure SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-cluster.conf
    mode: "0644"
    content: |
      PasswordAuthentication yes
      PubkeyAuthentication yes
      PermitRootLogin yes
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ ssh_targets | default([]) }}"
  register: ssh_hardening

# A handler would run on the play host, not on the delegated target.
- name: Restart SSH service on targets whose config changed
  ansible.builtin.service:
    name: ssh
    state: restarted
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ (ssh_stale_dropin.results + ssh_hardening.results) | selectattr('changed') | map(attribute='item') | unique | list }}"
