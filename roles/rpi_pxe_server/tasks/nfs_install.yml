---
- name: Install NFS server
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: true

- name: Ensure exports drop-in directory exists
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Ensure NFS export base directory exists
  ansible.builtin.file:
    path: "{{ nfs_root_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Ensure NFSv4 root export line exists
  ansible.builtin.blockinfile:
    path: /etc/exports.d/cluster.exports
    create: true
    mode: "0644"
    marker: "# {mark} NFSv4 root export"
    block: |
      # NFSv4 root export (fsid=0)
      {{ nfs_root_dir }} {{ pxe_proxy_network }}/24(rw,fsid=0,no_subtree_check,async)
